name: Python CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev requirements
        run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Demo run
        run: python -m banking_lakehouse.cli demo --count 100 --out-dir data
      - name: Check reconciliation
        run: python -c "import json; s=json.load(open('data/reports/run_summary.json')); assert s['row_count_reconciled'] and s['silver_count']==100"
