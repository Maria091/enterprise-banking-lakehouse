[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-banking-lakehouse"
version = "0.1.0"
description = "Synthetic banking medallion lakehouse"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ai = ["scikit-learn>=1.4,<2"]

[project.scripts]
banking-lakehouse = "banking_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
